name: Build CLA5 Recovery
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04
    steps:
    - name: Setup Build Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig

    - name: Install Repo
      run: |
        mkdir ~/bin
        curl https://googleapis.com > ~/bin/repo
        chmod a+x ~/bin/repo
        export PATH=$PATH:~/bin

    - name: Sync Source
      run: |
        repo init --depth=1 -u https://github.com -b fox_12.1
        repo sync -j$(nproc --all)

    - name: Clone Device Tree
      run: |
        git clone https://github.com -b fox_12.1 device/tecno/CLA5

    - name: Start Build
      run: |
        export ALLOW_MISSING_DEPENDENCIES=true
        . build/envsetup.sh
        lunch twrp_CLA5-eng
        mka vendorbootimage
        
